{% extends "base.html" %}
{% block title %}{{ title }}{% end %}
{% block admin_content %}
<section class="v02-page settings-page">
  <header class="v02-heading"><div><p class="section-kicker">运行参数</p><h2>系统设置</h2><p>保存前执行类型与范围校验；修改结果写入操作审计并由业务代码即时读取。</p></div></header>
  <form method="post" action="/admin/settings" class="settings-form">{% raw xsrf_form_html() %}<input type="hidden" name="action" value="batch_update">
    <article class="v02-panel"><header class="v02-panel-header"><div><h3>品牌与首页</h3><p>用户侧和管理侧共用的基础信息</p></div></header><div class="settings-grid">
      <label class="v02-field"><span>系统名称</span><input class="v02-input" name="setting_system_name" value="{{ settings.get('system_name','') }}" maxlength="100" required></label>
      <label class="v02-field"><span>Logo 地址</span><input class="v02-input" name="setting_system_logo" value="{{ settings.get('system_logo','') }}" maxlength="500" placeholder="本地静态资源路径"></label>
      <label class="v02-field full"><span>系统简介</span><textarea class="v02-textarea" name="setting_system_description" maxlength="1000">{{ settings.get('system_description','') }}</textarea></label>
      <label class="v02-field full"><span>首页公告</span><textarea class="v02-textarea" name="setting_home_announcement" maxlength="1000">{{ settings.get('home_announcement','') }}</textarea></label>
      <label class="v02-field"><span>默认模型 ID</span><input class="v02-input" name="setting_default_model" value="{{ settings.get('default_model','') }}" inputmode="numeric" placeholder="留空时使用模型引擎默认项"></label>
    </div></article>
    <article class="v02-panel"><header class="v02-panel-header"><div><h3>功能开关</h3><p>关闭状态会由登录、用户端和服务入口直接执行</p></div></header><div class="settings-switches">
      <label><input type="checkbox" name="setting_allow_register" value="true" {% if settings.get('allow_register') == 'true' %}checked{% end %}><span>允许新用户注册</span></label>
      <label><input type="checkbox" name="setting_enable_face_login" value="true" {% if settings.get('enable_face_login') == 'true' %}checked{% end %}><span>启用人脸登录</span></label>
      <label><input type="checkbox" name="setting_enable_voice_report" value="true" {% if settings.get('enable_voice_report') == 'true' %}checked{% end %}><span>启用语音播报</span></label>
      <label><input type="checkbox" name="setting_maintenance_mode" value="true" {% if settings.get('maintenance_mode') == 'true' %}checked{% end %}><span>用户侧维护模式</span></label>
    </div></article>
    <article class="v02-panel"><header class="v02-panel-header"><div><h3>容量与超时</h3><p>输入不在安全范围内时整批设置不会保存</p></div></header><div class="settings-grid compact">
      <label class="v02-field"><span>敏感词阈值（1—100）</span><input class="v02-input" type="number" min="1" max="100" name="setting_sensitive_word_threshold" value="{{ settings.get('sensitive_word_threshold','5') }}"></label>
      <label class="v02-field"><span>大屏刷新秒数（5—3600）</span><input class="v02-input" type="number" min="5" max="3600" name="setting_screen_refresh_interval" value="{{ settings.get('screen_refresh_interval','30') }}"></label>
      <label class="v02-field"><span>采集超时秒数（3—120）</span><input class="v02-input" type="number" min="3" max="120" name="setting_default_collect_timeout" value="{{ settings.get('default_collect_timeout','30') }}"></label>
      <label class="v02-field"><span>单次最大采集量（1—1000）</span><input class="v02-input" type="number" min="1" max="1000" name="setting_max_collect_count" value="{{ settings.get('max_collect_count','100') }}"></label>
      <label class="v02-field"><span>单文件上传字节（1MB—100MB）</span><input class="v02-input" type="number" min="1048576" max="104857600" name="setting_max_upload_size" value="{{ settings.get('max_upload_size','52428800') }}"></label>
      <label class="v02-field"><span>登录会话分钟（5—10080）</span><input class="v02-input" type="number" min="5" max="10080" name="setting_session_timeout_minutes" value="{{ settings.get('session_timeout_minutes','1440') }}"></label>
      <label class="v02-field"><span>无活动超时分钟（1—1440）</span><input class="v02-input" type="number" min="1" max="1440" name="setting_session_inactivity_timeout_minutes" value="{{ settings.get('session_inactivity_timeout_minutes','30') }}"></label>
    </div></article>
    <div class="settings-submit"><button class="v02-button" type="submit">保存全部设置</button><span>敏感配置只允许保存环境变量名，不接受密钥明文。</span></div>
  </form>
</section>
{% end %}
