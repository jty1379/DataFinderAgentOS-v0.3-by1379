<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="renderer" content="webkit">
    <meta name="theme-color" content="#071426">
    <link rel="icon" href="{{ static_url('favicon.svg') }}" type="image/svg+xml">
    <title>{% block title %}瞭望与问数系统{% end %}</title>
    <link rel="stylesheet" href="{{ static_url('dist/bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ static_url('dist/layui/css/layui.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/base.css') }}">
    {% block head %}{% end %}
</head>
<body>
    {% block content %}{% end %}
    <div id="app-toast" class="app-toast" role="status" aria-live="polite"></div>
    <script src="{{ static_url('dist/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ static_url('dist/layui/layui.js') }}"></script>
    <script src="{{ static_url('js/base.js') }}"></script>
    {% block scripts %}{% end %}
</body>
</html>
